<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <title>今日运势 | Always Following dxy</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Poppins', 'Segoe UI', sans-serif;
        }

        :root {
            --primary: #ff3b8d;
            --secondary: #ff8cc6;
            --dark: #6d0039;
            --light: #fff9fb;
            --nav-height: 70px;
        }

        body {
            background: linear-gradient(135deg, #ffd8e9, #ffeef5);
            min-height: 100vh;
            color: #333;
            padding-top: var(--nav-height);
        }

        /* 导航栏样式（与首页一致） */
        .navbar {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: var(--nav-height);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 40px;
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.1);
            z-index: 1000;
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 12px;
            font-weight: 700;
            font-size: 1.4rem;
            color: var(--dark);
        }

        .logo-img {
            height: 45px;
            width: auto;
            border-radius: 8px;
        }

        .nav-links {
            display: flex;
            gap: 15px;
        }

        .nav-link {
            text-decoration: none;
            padding: 8px 18px;
            border-radius: 30px;
            font-weight: 500;
            color: var(--dark);
            transition: all 0.3s ease;
            background: rgba(255, 255, 255, 0.7);
            border: 1px solid rgba(0, 0, 0, 0.05);
        }

        .nav-link:hover, .nav-link.active {
            background: var(--primary);
            color: white;
        }

        /* 页面主体 */
        .page {
            width: min(100%, 760px);
            margin: 0 auto;
            padding: 32px 20px 48px;
        }

        .section-title {
            color: var(--dark);
            font-size: 1.45rem;
            text-align: center;
            margin-bottom: 4px;
        }

        .section-hint {
            color: #a0607f;
            font-size: 0.9rem;
            text-align: center;
            margin-bottom: 20px;
        }

        /* 今日运势 */
        .fortune {
            display: flex;
            flex-direction: column;
            align-items: center;
            margin-bottom: 40px;
        }

        .fortune-date {
            color: #a0607f;
            font-size: 0.9rem;
            margin-bottom: 18px;
        }

        /* 签筒 */
        .draw-button {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 14px;
            border: none;
            background: none;
            cursor: pointer;
            color: var(--dark);
            font-size: 1rem;
            font-weight: 600;
        }

        .tube {
            position: relative;
            width: 96px;
            height: 128px;
            margin-top: 34px;
            border-radius: 14px 14px 22px 22px;
            background: linear-gradient(90deg, #c2185b, #ff5c9d 45%, #c2185b);
            box-shadow: 0 14px 28px rgba(109, 0, 57, 0.25);
            transform-origin: 50% 90%;
        }

        .tube::after {
            content: "签";
            position: absolute;
            left: 50%;
            top: 50%;
            transform: translate(-50%, -50%);
            width: 44px;
            height: 44px;
            border-radius: 50%;
            background: #fff3d6;
            color: #c2185b;
            font-size: 1.3rem;
            font-weight: 700;
            line-height: 44px;
            text-align: center;
        }

        .stick {
            position: absolute;
            bottom: 100%;
            width: 10px;
            height: 46px;
            border-radius: 4px 4px 0 0;
            background: #f3c98b;
        }

        .stick:nth-child(1) { left: 22px; height: 40px; transform: rotate(-8deg); }
        .stick:nth-child(2) { left: 43px; height: 50px; }
        .stick:nth-child(3) { left: 64px; height: 38px; transform: rotate(8deg); }

        .draw-button.shaking .tube {
            animation: shake 0.24s ease-in-out 5;
        }

        @keyframes shake {
            0%, 100% { transform: rotate(0deg); }
            25% { transform: rotate(-12deg); }
            75% { transform: rotate(12deg); }
        }

        /* 签文 */
        .fortune-card {
            display: none;
            width: min(100%, 420px);
            padding: 26px 24px 22px;
            border-radius: 18px;
            background: #fffdf8;
            box-shadow: 0 18px 40px rgba(109, 0, 57, 0.14);
            text-align: center;
        }

        .fortune-card.show {
            display: block;
            animation: pop 0.5s ease;
        }

        .fortune-level {
            display: inline-block;
            padding: 6px 22px;
            border-radius: 30px;
            color: white;
            font-size: 1.5rem;
            font-weight: 700;
            letter-spacing: 4px;
            margin-bottom: 18px;
        }

        .level-大吉 { background: linear-gradient(135deg, #ff3b8d, #ff8a3d); }
        .level-中吉 { background: #ff5c9d; }
        .level-小吉 { background: #f48fb1; }
        .level-吉 { background: #c48da7; }

        .fortune-rows {
            display: grid;
            grid-template-columns: auto 1fr;
            gap: 8px 12px;
            text-align: left;
            margin-bottom: 16px;
        }

        .fortune-tag {
            padding: 2px 10px;
            border-radius: 8px;
            font-weight: 700;
            font-size: 0.9rem;
            height: fit-content;
        }

        .tag-yi { background: #e3f6ea; color: #23864b; }
        .tag-ji { background: #fde4e4; color: #c0392b; }

        .fortune-words {
            color: var(--dark);
            font-size: 1.05rem;
            line-height: 1.6;
        }

        .fortune-bonus {
            margin-top: 16px;
            padding: 10px 14px;
            border-radius: 12px;
            background: #fff0f6;
            color: #c0306f;
            font-size: 0.92rem;
            font-weight: 600;
        }

        .fortune-bonus:empty {
            display: none;
        }

        .fortune-next {
            margin-top: 14px;
            color: #b88aa1;
            font-size: 0.82rem;
        }

        /* 幸运转盘 */
        .lottery {
            display: flex;
            flex-direction: column;
            align-items: center;
            margin-bottom: 44px;
            /* 转盘旋转时外接方框会变大（对角线），裁掉以免手机端页面被撑宽 */
            overflow: hidden;
        }

        .ticket {
            display: flex;
            align-items: center;
            gap: 10px;
            margin: 14px 0 26px;
            padding: 10px 22px;
            border: 2px dashed #ff8cc6;
            border-radius: 14px;
            background: #fffdf8;
            color: var(--dark);
            font-weight: 600;
        }

        .ticket.empty {
            border-color: #e3cbd7;
            color: #b88aa1;
        }

        .ticket-count {
            padding: 2px 10px;
            border-radius: 20px;
            background: var(--primary);
            color: white;
            font-size: 0.9rem;
        }

        .ticket.empty .ticket-count {
            background: #d9c2cd;
        }

        .ticket.ready {
            animation: glow 1.4s ease 2;
        }

        /* 转盘：扇区只显示问号，转停后才揭晓指针所指的那一格 */
        .wheel-wrap {
            position: relative;
            width: min(80vw, 320px);
            aspect-ratio: 1;
        }

        .pointer {
            position: absolute;
            left: 50%;
            top: -14px;
            width: 0;
            height: 0;
            border-left: 15px solid transparent;
            border-right: 15px solid transparent;
            border-top: 30px solid var(--dark);
            transform: translateX(-50%);
            filter: drop-shadow(0 3px 3px rgba(0, 0, 0, 0.25));
            z-index: 2;
        }

        .wheel {
            position: absolute;
            inset: 0;
            border-radius: 50%;
            border: 8px solid white;
            box-shadow: 0 16px 36px rgba(109, 0, 57, 0.22);
            transition: transform 4.8s cubic-bezier(0.15, 0.7, 0.12, 1);
        }

        .slice-label {
            position: absolute;
            inset: 0;
            pointer-events: none;
        }

        .slice-label span {
            position: absolute;
            left: 50%;
            top: 7%;
            transform: translateX(-50%);
            color: white;
            font-size: 1.05rem;
            font-weight: 700;
            text-shadow: 0 1px 3px rgba(109, 0, 57, 0.35);
            white-space: nowrap;
            transition: all 0.4s ease;
        }

        .slice-label.revealed span {
            top: 11%;
            padding: 3px 8px;
            border-radius: 10px;
            background: white;
            color: var(--primary);
            font-size: 0.82rem;
            text-shadow: none;
            box-shadow: 0 4px 10px rgba(109, 0, 57, 0.25);
        }

        .spin-button {
            position: absolute;
            left: 50%;
            top: 50%;
            width: 76px;
            height: 76px;
            border: 5px solid white;
            border-radius: 50%;
            background: var(--primary);
            color: white;
            font-size: 1.15rem;
            font-weight: 700;
            transform: translate(-50%, -50%);
            box-shadow: 0 6px 16px rgba(109, 0, 57, 0.3);
            cursor: pointer;
            z-index: 2;
        }

        .spin-button:disabled {
            background: #d9c2cd;
            cursor: default;
        }

        .lottery-result {
            display: none;
            margin-top: 24px;
            padding: 16px 22px;
            border-radius: 16px;
            background: #fffdf8;
            box-shadow: 0 12px 28px rgba(109, 0, 57, 0.12);
            text-align: center;
            color: var(--dark);
        }

        .lottery-result.show {
            display: block;
            animation: pop 0.5s ease;
        }

        .lottery-result strong {
            display: block;
            font-size: 1.2rem;
            margin-bottom: 4px;
        }

        .lottery-result small {
            color: #a0607f;
        }

        /* 我的兑换券 */
        .coupons {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 16px;
        }

        .coupons-empty {
            grid-column: 1 / -1;
            padding: 22px;
            border-radius: 14px;
            background: rgba(255, 255, 255, 0.55);
            color: #a0607f;
            text-align: center;
        }

        .coupon {
            position: relative;
            display: flex;
            align-items: center;
            gap: 12px;
            min-height: 96px;
            padding: 14px 16px 14px 18px;
            border: none;
            border-radius: 14px;
            background-color: white;
            box-shadow: 0 8px 20px rgba(109, 0, 57, 0.1);
            border-left: 6px solid var(--primary);
            text-align: left;
            cursor: pointer;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }

        .coupon:hover {
            transform: translateY(-2px);
            box-shadow: 0 12px 24px rgba(109, 0, 57, 0.16);
        }

        .coupon.fresh {
            animation: glow 1.4s ease 2;
        }

        @keyframes glow {
            0%, 100% { box-shadow: 0 8px 20px rgba(109, 0, 57, 0.1); }
            50% { box-shadow: 0 0 0 4px rgba(255, 59, 141, 0.45), 0 12px 26px rgba(255, 59, 141, 0.35); }
        }

        .coupon-icon {
            font-size: 2rem;
            flex-shrink: 0;
        }

        .coupon-title {
            color: var(--dark);
            font-weight: 700;
            font-size: 1.02rem;
            margin-bottom: 4px;
        }

        .coupon-desc {
            color: #8a5a72;
            font-size: 0.82rem;
            line-height: 1.45;
        }

        .coupon-date {
            color: #b88aa1;
            font-size: 0.75rem;
            margin-top: 4px;
        }

        .coupon.used {
            border-left-color: #c9b3be;
            background-color: #f7f1f4;
        }

        .coupon.used .coupon-icon,
        .coupon.used .coupon-title,
        .coupon.used .coupon-desc,
        .coupon.used .coupon-date {
            opacity: 0.45;
        }

        .coupon.used::after {
            content: "已兑换";
            position: absolute;
            right: 12px;
            top: 50%;
            padding: 2px 10px;
            border: 2px solid #c0306f;
            border-radius: 8px;
            color: #c0306f;
            font-weight: 700;
            font-size: 0.9rem;
            transform: translateY(-50%) rotate(-14deg);
            opacity: 0.8;
        }

        /* 兑换弹窗 */
        .modal {
            position: fixed;
            inset: 0;
            display: none;
            align-items: center;
            justify-content: center;
            padding: 20px;
            background: rgba(109, 0, 57, 0.35);
            z-index: 2000;
        }

        .modal.show {
            display: flex;
        }

        .modal-card {
            width: min(100%, 360px);
            padding: 28px 24px 22px;
            border-radius: 20px;
            background: white;
            text-align: center;
            animation: pop 0.35s ease;
        }

        .modal-icon {
            font-size: 3.4rem;
            margin-bottom: 8px;
        }

        .modal-title {
            color: var(--dark);
            font-size: 1.4rem;
            margin-bottom: 6px;
        }

        .modal-desc {
            color: #8a5a72;
            margin-bottom: 18px;
            line-height: 1.5;
        }

        .modal-tip {
            padding: 10px 12px;
            border-radius: 12px;
            background: #fff0f6;
            color: #c0306f;
            font-size: 0.9rem;
            margin-bottom: 20px;
        }

        .modal-actions {
            display: flex;
            gap: 12px;
            justify-content: center;
        }

        .pill-button {
            padding: 10px 22px;
            border: none;
            border-radius: 30px;
            font-size: 0.95rem;
            font-weight: 600;
            cursor: pointer;
        }

        .pill-button.primary {
            background: var(--primary);
            color: white;
            box-shadow: 0 8px 18px rgba(255, 59, 141, 0.3);
        }

        .pill-button.ghost {
            background: #f5eef2;
            color: var(--dark);
        }

        @keyframes pop {
            0% { transform: scale(0.85); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }

        /* 好运券兑换：全屏好运秀 */
        .luck-show {
            position: fixed;
            inset: 0;
            display: none;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            background: radial-gradient(circle at 50% 35%, #fff6c2 0%, #ffd36b 28%, #ff7aa8 70%, #a3104f 100%);
            z-index: 3000;
        }

        .luck-show.show {
            display: flex;
            animation: luckFadeIn 0.4s ease;
        }

        .luck-show.flash::after {
            content: "";
            position: absolute;
            inset: 0;
            background: white;
            animation: luckFlash 0.5s ease forwards;
            z-index: 3;
        }

        .luck-rays {
            position: absolute;
            left: 50%;
            top: 35%;
            width: 220vmax;
            height: 220vmax;
            background: repeating-conic-gradient(rgba(255, 255, 255, 0.22) 0deg 9deg, transparent 9deg 18deg);
            transform: translate(-50%, -50%);
            animation: luckSpin 14s linear infinite;
        }

        .luck-rain span {
            position: absolute;
            top: -8%;
            animation: luckFall linear forwards;
            pointer-events: none;
        }

        .luck-stage {
            position: relative;
            z-index: 2;
            width: min(92vw, 440px);
            text-align: center;
        }

        .luck-title {
            color: white;
            font-size: 1.6rem;
            text-shadow: 0 3px 10px rgba(163, 16, 79, 0.45);
            margin-bottom: 16px;
            animation: luckBounce 1.2s ease-in-out infinite;
        }

        .luck-wishes {
            list-style: none;
            transition: opacity 0.4s ease, transform 0.4s ease;
        }

        .luck-wishes.leave {
            opacity: 0;
            transform: scale(0.8);
        }

        .luck-wishes li {
            margin: 7px 0;
            padding: 7px 12px;
            border-radius: 12px;
            background: rgba(255, 255, 255, 0.92);
            color: var(--dark);
            font-size: 0.93rem;
            font-weight: 600;
            box-shadow: 0 6px 14px rgba(163, 16, 79, 0.18);
            animation: wishIn 0.45s cubic-bezier(0.2, 1.4, 0.4, 1);
        }

        .luck-wishes li:last-child:nth-child(9) {
            background: linear-gradient(135deg, #ffe066, #ffb703);
        }

        .luck-bill {
            display: none;
            padding: 26px 22px 22px;
            border-radius: 20px;
            background: white;
            color: var(--dark);
            box-shadow: 0 18px 40px rgba(163, 16, 79, 0.3);
        }

        .luck-bill.show {
            display: block;
            animation: pop 0.4s ease;
        }

        .bill-label {
            color: #a0607f;
            margin-bottom: 14px;
        }

        .bill-loading {
            font-size: 1.15rem;
            font-weight: 600;
        }

        .bill-dots::after {
            content: "";
            animation: billDots 1.2s steps(4) infinite;
        }

        .bill-punch,
        .luck-bill #luckClose {
            display: none;
        }

        .luck-bill.done .bill-loading {
            display: none;
        }

        .luck-bill.done .bill-punch {
            display: block;
            color: var(--primary);
            font-size: 1.45rem;
            font-weight: 800;
            line-height: 1.45;
            margin-bottom: 20px;
            animation: punchIn 0.7s cubic-bezier(0.2, 1.5, 0.4, 1);
        }

        .luck-bill.done #luckClose {
            display: inline-block;
            animation: pop 0.4s ease 0.5s both;
        }

        @keyframes luckFadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        @keyframes luckFlash {
            from { opacity: 0.95; }
            to { opacity: 0; }
        }

        @keyframes luckSpin {
            to { transform: translate(-50%, -50%) rotate(360deg); }
        }

        @keyframes luckFall {
            to { transform: translateY(115vh) rotate(540deg); }
        }

        @keyframes luckBounce {
            0%, 100% { transform: translateY(0) scale(1); }
            50% { transform: translateY(-6px) scale(1.04); }
        }

        @keyframes wishIn {
            from { opacity: 0; transform: translateY(14px) scale(0.85); }
            to { opacity: 1; transform: none; }
        }

        @keyframes billDots {
            0% { content: ""; }
            25% { content: "."; }
            50% { content: ".."; }
            75% { content: "..."; }
        }

        @keyframes punchIn {
            0% { opacity: 0; transform: scale(2.4) rotate(-6deg); }
            60% { opacity: 1; transform: scale(0.92) rotate(2deg); }
            80% { transform: scale(1.04) rotate(-1deg); }
            100% { transform: none; }
        }

        /* 响应式设计：手机端 5 个入口排成 3 + 2，第二行居中 */
        @media (max-width: 768px) {
            :root {
                --nav-height: 142px;
            }

            .navbar {
                align-items: stretch;
                justify-content: center;
                flex-direction: column;
                gap: 8px;
                padding: 10px 12px 12px;
            }

            .logo {
                justify-content: center;
                font-size: 0.95rem;
                gap: 8px;
            }

            .logo-img {
                height: 32px;
            }

            .nav-links {
                flex-wrap: wrap;
                justify-content: center;
                gap: 8px;
                width: min(100%, 430px);
                margin: 0 auto;
            }

            .nav-link {
                flex: 0 0 calc((100% - 16px) / 3); /* 固定 1/3 宽，始终 3 + 2 两行 */
                display: flex;
                align-items: center;
                justify-content: center;
                min-height: 34px;
                padding: 7px 4px;
                border-radius: 12px;
                font-size: min(0.82rem, 3.4vw);
                line-height: 1.15;
                white-space: nowrap;
            }

            .page {
                padding: 24px 14px 40px;
            }

            .coupons {
                grid-template-columns: 1fr;
                gap: 12px;
            }
        }
    </style>
</head>

<body>
    <nav class="navbar">
        <div class="logo">
            <img src="./images2/logo.png" alt="Logo" class="logo-img">
            <span>Always Following dxy</span>
        </div>
        <div class="nav-links">
            <a href="index.html?skipIntro=1" class="nav-link">首页</a>
            <a href="game.html" class="nav-link">互动小游戏</a>
            <a href="heart.html" class="nav-link">瞅瞅金博的心脏</a>
            <a href="message.html" class="nav-link">给金博递纸条</a>
            <a href="fortune.html" class="nav-link active">今日运势</a>
        </div>
    </nav>

    <main class="page">
        <section class="fortune">
            <h1 class="section-title">dxy 的今日运势 🔮</h1>
            <p class="fortune-date" id="fortuneDate"></p>

            <button type="button" class="draw-button" id="drawButton">
                <span class="tube" aria-hidden="true">
                    <span class="stick"></span><span class="stick"></span><span class="stick"></span>
                </span>
                <span>摇一摇，抽今日签</span>
            </button>

            <article class="fortune-card" id="fortuneCard" aria-live="polite">
                <div class="fortune-level" id="fortuneLevel"></div>
                <div class="fortune-rows">
                    <span class="fortune-tag tag-yi">宜</span><span id="fortuneYi"></span>
                    <span class="fortune-tag tag-ji">忌</span><span id="fortuneJi"></span>
                </div>
                <p class="fortune-words" id="fortuneWords"></p>
                <div class="fortune-bonus">🎫 今日运势附赠：抽奖券 × 1，往下滑去转盘抽奖吧～</div>
                <p class="fortune-next">每天只能抽一次，明天再来看看吧</p>
            </article>
        </section>

        <section class="lottery" id="lottery">
            <h2 class="section-title">幸运转盘 🎡</h2>
            <p class="section-hint">用今日运势送的抽奖券转一次，转到什么就是什么</p>

            <div class="ticket empty" id="ticket">
                <span id="ticketLabel">🎫 先抽今日运势，领取抽奖券</span>
                <span class="ticket-count" id="ticketCount">× 0</span>
            </div>

            <div class="wheel-wrap">
                <div class="pointer" aria-hidden="true"></div>
                <div class="wheel" id="wheel" aria-hidden="true"></div>
                <button type="button" class="spin-button" id="spinButton" disabled>先抽签</button>
            </div>

            <div class="lottery-result" id="lotteryResult" aria-live="polite"></div>
        </section>

        <section>
            <h2 class="section-title">我的兑换券 🎟️</h2>
            <p class="section-hint">点开想用的券，截图发给金博就能兑换</p>
            <div class="coupons" id="coupons"></div>
        </section>
    </main>

    <div class="modal" id="couponModal" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
        <div class="modal-card">
            <div class="modal-icon" id="modalIcon"></div>
            <h3 class="modal-title" id="modalTitle"></h3>
            <p class="modal-desc" id="modalDesc"></p>
            <p class="modal-tip" id="modalTip"></p>
            <div class="modal-actions">
                <button type="button" class="pill-button ghost" id="modalClose">先留着</button>
                <button type="button" class="pill-button primary" id="modalRedeem">我已兑换</button>
            </div>
        </div>
    </div>

    <div class="luck-show" id="luckShow" role="dialog" aria-modal="true" aria-label="好运券兑换" aria-live="polite">
        <div class="luck-rays" aria-hidden="true"></div>
        <div class="luck-rain" id="luckRain" aria-hidden="true"></div>
        <div class="luck-stage">
            <h2 class="luck-title">🍀 好运券 · 兑换成功 🍀</h2>
            <ul class="luck-wishes" id="luckWishes"></ul>
            <div class="luck-bill" id="luckBill">
                <p class="bill-label">本次兑换，金博需要付出：</p>
                <p class="bill-loading">结算中<span class="bill-dots"></span></p>
                <p class="bill-punch">其实就是金博啥事也不用干 😏</p>
                <button type="button" class="pill-button primary" id="luckClose">可恶，被套路了 😤</button>
            </div>
        </div>
    </div>

    <script>
        const FORTUNES = [
            { level: "大吉", yi: "喝奶茶、晒太阳", ji: "委屈自己", words: "今天的好运多到溢出来。" },
            { level: "大吉", yi: "出门走走、拍好看的照片", ji: "宅在家发呆", words: "南京第一美少女今日气场全开。" },
            { level: "大吉", yi: "吃顿好的", ji: "减肥", words: "吃饱了才有力气可爱。" },
            { level: "中吉", yi: "早点睡", ji: "熬夜刷手机", words: "睡饱的萌萌圆脸最好捏。" },
            { level: "中吉", yi: "听喜欢的歌", ji: "想太多", words: "烦心事交给明天的自己。" },
            { level: "中吉", yi: "多喝热水", ji: "喝冰的", words: "金博叮嘱的，不许嫌啰嗦。" },
            { level: "中吉", yi: "找人聊天", ji: "一个人生闷气", words: "有什么不开心，可以递张纸条给金博。" },
            { level: "小吉", yi: "慢慢来", ji: "着急", words: "今天的进度条可以慢一点。" },
            { level: "小吉", yi: "吃点甜的", ji: "空腹出门", words: "低血糖的丁香鱼会变成小咸鱼。" },
            { level: "小吉", yi: "伸个懒腰", ji: "久坐不动", words: "起来走两步，好运才追得上你。" },
            { level: "吉", yi: "发呆五分钟", ji: "自我怀疑", words: "平平常常的一天，也有人在一直关注你。" },
            { level: "吉", yi: "照照镜子", ji: "说自己不好看", words: "镜子里的人今天也很好看。" }
        ];

        // 奖品：short 是转停后在扇区上揭晓的短名；好运券其实是「谢谢惠顾」，兑换时放一场恶搞好运秀
        const PRIZES = {
            milktea: { icon: "🧋", title: "奶茶券", short: "奶茶券", desc: "金博请喝奶茶一杯，甜度随你挑" },
            song: { icon: "🎤", title: "点歌券", short: "点歌券", desc: "指定一首歌，金博认真唱给你听" },
            sad: { icon: "🥺", title: "八卦券（伤心的事）", short: "伤心八卦", desc: "金博讲一件他伤心的事，不许敷衍" },
            happy: { icon: "😆", title: "八卦券（开心的事）", short: "开心八卦", desc: "金博讲一件他开心的事，越详细越好" },
            class: { icon: "📚", title: "陪上课券", short: "陪上课", desc: "金博陪你上一节课，保证不打扰、不睡着" },
            luck: { icon: "🍀", title: "好运券", short: "好运券", desc: "超级好运加持一次，兑换后当场生效" }
        };

        // 转盘 20 格（每格 5%），概率 = 格数 / 20：
        // 好运 25%、开心八卦 20%、伤心八卦 20%、奶茶 15%、陪上课 15%、点歌 5%；同类不相邻（含首尾）
        const SLICES = [
            "luck", "happy", "sad", "milktea", "luck", "class", "happy", "sad", "luck", "milktea",
            "class", "happy", "luck", "sad", "milktea", "class", "luck", "happy", "sad", "song"
        ];

        // 指定日期必中的奖品（日期格式同 todayKey，如 "2026-10-9"）
        const FIXED_PRIZES = {
            "2026-10-9": "sad"
        };
        const SLICE_ANGLE = 360 / SLICES.length;
        const SLICE_COLORS = ["#ff5c9d", "#ff9cc7"];

        // 本机存储：今日运势 { date }，今日抽奖 { date, slice }，兑换券 [{ id, kind, date, used }]
        const FORTUNE_KEY = "dxy_fortune";
        const LOTTERY_KEY = "dxy_lottery";
        const WALLET_KEY = "dxy_wallet";

        const drawButton = document.getElementById("drawButton");
        const fortuneCard = document.getElementById("fortuneCard");
        const wheel = document.getElementById("wheel");
        const spinButton = document.getElementById("spinButton");
        const resultBox = document.getElementById("lotteryResult");
        const couponList = document.getElementById("coupons");
        const modal = document.getElementById("couponModal");

        function loadJSON(key, fallback) {
            try {
                return JSON.parse(localStorage.getItem(key)) ?? fallback;
            } catch {
                return fallback;
            }
        }

        function saveJSON(key, value) {
            localStorage.setItem(key, JSON.stringify(value));
        }

        function todayKey() {
            const d = new Date();
            return `${d.getFullYear()}-${d.getMonth() + 1}-${d.getDate()}`;
        }

        // 每天的签文和转盘结果都由日期决定（FNV-1a 哈希 + 各自的盐），任何设备同一天结果相同，换设备 / 清数据也没用
        function dailyIndex(salt, dateKey, count) {
            let hash = 0x811c9dc5;
            for (const char of salt + dateKey) {
                hash ^= char.codePointAt(0);
                hash = Math.imul(hash, 0x01000193) >>> 0;
            }
            return hash % count;
        }

        function lotterySlice(dateKey) {
            const fixed = FIXED_PRIZES[dateKey];
            if (!fixed) return dailyIndex("dxy-lottery", dateKey, SLICES.length);
            const candidates = SLICES.flatMap((kind, i) => (kind === fixed ? [i] : []));
            return candidates[dailyIndex("dxy-lottery", dateKey, candidates.length)];
        }

        function dateLabel(key) {
            const [, month, day] = key.split("-");
            return `${month} 月 ${day} 日获得`;
        }

        let wallet = loadJSON(WALLET_KEY, []);
        let rotation = 0;

        // ---------- 今日运势 ----------
        function showDate() {
            const d = new Date();
            const week = "日一二三四五六"[d.getDay()];
            document.getElementById("fortuneDate").textContent = `${d.getMonth() + 1} 月 ${d.getDate()} 日 · 星期${week}`;
        }

        function renderFortune() {
            const fortune = FORTUNES[dailyIndex("dxy-fortune", todayKey(), FORTUNES.length)];
            const level = document.getElementById("fortuneLevel");
            level.textContent = fortune.level;
            level.className = `fortune-level level-${fortune.level}`;
            document.getElementById("fortuneYi").textContent = fortune.yi;
            document.getElementById("fortuneJi").textContent = fortune.ji;
            document.getElementById("fortuneWords").textContent = fortune.words;
            drawButton.style.display = "none";
            fortuneCard.classList.add("show");
        }

        drawButton.addEventListener("click", () => {
            if (drawButton.classList.contains("shaking")) return;
            drawButton.classList.add("shaking");
            setTimeout(() => {
                saveJSON(FORTUNE_KEY, { date: todayKey() });
                renderFortune();
                setTicket("ready");
            }, 1200);
        });

        // 抽奖券三种状态：locked 还没抽签 / ready 可以转 / used 今天已转过
        function setTicket(state) {
            const ticket = document.getElementById("ticket");
            const label = document.getElementById("ticketLabel");
            const count = document.getElementById("ticketCount");
            ticket.classList.toggle("empty", state !== "ready");
            ticket.classList.toggle("ready", state === "ready");
            label.textContent = {
                locked: "🎫 先抽今日运势，领取抽奖券",
                ready: "🎫 今日抽奖券",
                used: "🎫 今日抽奖券已用完"
            }[state];
            count.textContent = state === "ready" ? "× 1" : "× 0";
            spinButton.disabled = state !== "ready";
            spinButton.textContent = { locked: "先抽签", ready: "抽！", used: "明天见" }[state];
        }

        // ---------- 转盘 ----------
        function buildWheel() {
            const stops = SLICES.map((_, i) =>
                `${SLICE_COLORS[i % 2]} ${i * SLICE_ANGLE}deg ${(i + 1) * SLICE_ANGLE}deg`);
            wheel.style.background = `conic-gradient(${stops.join(", ")})`;
            SLICES.forEach((_, i) => {
                const label = document.createElement("div");
                label.className = "slice-label";
                label.style.transform = `rotate(${i * SLICE_ANGLE + SLICE_ANGLE / 2}deg)`;
                label.innerHTML = "<span>?</span>";
                wheel.appendChild(label);
            });
        }

        function revealSlice(index) {
            const label = wheel.children[index];
            label.classList.add("revealed");
            label.firstChild.textContent = PRIZES[SLICES[index]].short;
        }

        // 让第 index 格的中心对准顶部指针
        function rotationFor(index, extraTurns) {
            const center = index * SLICE_ANGLE + SLICE_ANGLE / 2;
            const jitter = (Math.random() - 0.5) * SLICE_ANGLE * 0.6;
            const target = ((-center - rotation) % 360 + 360) % 360;
            return rotation + extraTurns * 360 + target + jitter;
        }

        function showResult(kind, isToday) {
            const prize = PRIZES[kind];
            resultBox.innerHTML = `<strong>${isToday ? "🎉 抽中了" : "今天抽中了"} ${prize.icon} ${prize.title}</strong><small>已经放进下面的兑换券里啦，明天再来抽新的～</small>`;
            resultBox.classList.add("show");
        }

        spinButton.addEventListener("click", () => {
            if (spinButton.disabled) return;
            spinButton.disabled = true;

            const today = todayKey();
            const index = lotterySlice(today);
            const kind = SLICES[index];
            // 先记下结果，转到一半关掉页面也不会丢券或重抽
            saveJSON(LOTTERY_KEY, { date: today, slice: index });
            // 每个日期最多一张券（只清了抽奖记录、没清券夹时不会重复入账）
            let coupon = wallet.find((item) => item.date === today);
            if (!coupon) {
                coupon = { id: Date.now(), kind, date: today, used: false };
                wallet.unshift(coupon);
                saveJSON(WALLET_KEY, wallet);
            }

            rotation = rotationFor(index, 6);
            wheel.style.transform = `rotate(${rotation}deg)`;
            wheel.addEventListener("transitionend", function onStop() {
                wheel.removeEventListener("transitionend", onStop);
                revealSlice(index);
                setTicket("used");
                showResult(kind, true);
                renderCoupons(coupon.id);
            });
        });

        // ---------- 我的兑换券 ----------
        function renderCoupons(freshId = null) {
            couponList.innerHTML = "";
            if (wallet.length === 0) {
                couponList.innerHTML = `<div class="coupons-empty">还没有兑换券，快去转盘试试手气吧～</div>`;
                return;
            }
            wallet.forEach((coupon) => {
                const prize = PRIZES[coupon.kind];
                const item = document.createElement("button");
                item.type = "button";
                item.className = "coupon" + (coupon.used ? " used" : "") + (coupon.id === freshId ? " fresh" : "");
                item.innerHTML = `<span class="coupon-icon">${prize.icon}</span><span><div class="coupon-title">${prize.title}</div><div class="coupon-desc">${prize.desc}</div><div class="coupon-date">${dateLabel(coupon.date)}</div></span>`;
                item.addEventListener("click", () => openCoupon(coupon));
                couponList.appendChild(item);
            });
        }

        let activeCoupon = null;

        function openCoupon(coupon) {
            const prize = PRIZES[coupon.kind];
            activeCoupon = coupon;
            document.getElementById("modalIcon").textContent = prize.icon;
            document.getElementById("modalTitle").textContent = prize.title;
            document.getElementById("modalDesc").textContent = prize.desc;
            const isLuck = coupon.kind === "luck";
            document.getElementById("modalTip").textContent = coupon.used
                ? (isLuck ? "好运已经生效过啦（金博确实啥也没干）" : "这张券已经兑换过啦，金博说到做到 ✓")
                : (isLuck ? "✨ 无需截图，点「立即兑换」好运当场生效" : "📸 截图发给金博，就能兑换啦");
            const redeemButton = document.getElementById("modalRedeem");
            redeemButton.textContent = isLuck ? "立即兑换" : "我已兑换";
            redeemButton.style.display = coupon.used ? "none" : "";
            document.getElementById("modalClose").textContent = coupon.used ? "好的" : "先留着";
            modal.classList.add("show");
        }

        function closeModal() {
            modal.classList.remove("show");
            activeCoupon = null;
        }

        document.getElementById("modalClose").addEventListener("click", closeModal);
        modal.addEventListener("click", (event) => {
            if (event.target === modal) closeModal();
        });
        document.getElementById("modalRedeem").addEventListener("click", () => {
            const coupon = activeCoupon;
            if (coupon) {
                coupon.used = true;
                saveJSON(WALLET_KEY, wallet);
            }
            closeModal();
            renderCoupons();
            if (coupon?.kind === "luck") playLuckShow();
        });

        // ---------- 好运券兑换：好运秀 + 结尾反转 ----------
        const LUCK_WISHES = [
            "祝 dxy 考试全过，蒙的全对 ✍️",
            "祝 dxy 奶茶永远第二杯半价 🧋",
            "祝 dxy 出门公交刚好到站，红灯秒变绿灯 🚦",
            "祝 dxy 抢票一次就中，排队永远第一个 🎫",
            "祝 dxy 拆快递全是惊喜，拆盲盒全是隐藏款 📦",
            "祝 dxy 熬夜不长痘，早起不犯困 🌙",
            "祝 dxy 吃什么都不胖，要胖也只胖萌萌圆脸 🥟",
            "祝 dxy 天天被南京的太阳偏爱 ☀️",
            "以上好运，即刻到账 💫"
        ];
        const LUCK_RAIN = ["🍀", "✨", "⭐", "💰", "🌟", "🧧"];
        const luckShow = document.getElementById("luckShow");
        const sleep = (ms) => new Promise((resolve) => setTimeout(resolve, ms));
        let rainTimer = null;

        function dropLuck() {
            const drop = document.createElement("span");
            drop.textContent = LUCK_RAIN[Math.floor(Math.random() * LUCK_RAIN.length)];
            drop.style.left = `${Math.random() * 100}%`;
            drop.style.fontSize = `${18 + Math.random() * 22}px`;
            drop.style.animationDuration = `${2.4 + Math.random() * 2}s`;
            document.getElementById("luckRain").appendChild(drop);
            drop.addEventListener("animationend", () => drop.remove());
        }

        async function playLuckShow() {
            const wishes = document.getElementById("luckWishes");
            const bill = document.getElementById("luckBill");
            wishes.innerHTML = "";
            wishes.classList.remove("leave");
            bill.classList.remove("show", "done");
            luckShow.classList.add("show");
            rainTimer = setInterval(dropLuck, 110);

            await sleep(700);
            for (const wish of LUCK_WISHES) {
                const line = document.createElement("li");
                line.textContent = wish;
                wishes.appendChild(line);
                await sleep(620);
            }

            await sleep(700);
            luckShow.classList.add("flash");
            wishes.classList.add("leave");
            await sleep(500);
            luckShow.classList.remove("flash");
            wishes.innerHTML = "";
            bill.classList.add("show");

            await sleep(1800);
            clearInterval(rainTimer);
            bill.classList.add("done");
        }

        document.getElementById("luckClose").addEventListener("click", () => {
            clearInterval(rainTimer);
            luckShow.classList.remove("show");
            document.getElementById("luckRain").innerHTML = "";
        });

        // ---------- 初始化 ----------
        showDate();
        buildWheel();
        const today = todayKey();
        const fortuneDrawn = loadJSON(FORTUNE_KEY, null)?.date === today;
        const lotteryRecord = loadJSON(LOTTERY_KEY, null);
        if (fortuneDrawn) renderFortune();
        if (lotteryRecord && lotteryRecord.date === today) {
            // 今天已经转过：转盘直接停在结果上
            wheel.style.transition = "none";
            rotation = rotationFor(lotteryRecord.slice, 0);
            wheel.style.transform = `rotate(${rotation}deg)`;
            revealSlice(lotteryRecord.slice);
            setTicket("used");
            showResult(SLICES[lotteryRecord.slice], false);
        } else {
            setTicket(fortuneDrawn ? "ready" : "locked");
        }
        renderCoupons();
    </script>
</body>

</html>
