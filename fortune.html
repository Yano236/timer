<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <title>每日抽奖 | Always Following dxy</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Poppins', 'Segoe UI', sans-serif;
        }

        :root {
            --primary: #ff3b8d;
            --secondary: #ff8cc6;
            --dark: #6d0039;
            --light: #fff9fb;
            --nav-height: 70px;
        }

        body {
            background: linear-gradient(135deg, #ffd8e9, #ffeef5);
            min-height: 100vh;
            color: #333;
            padding-top: var(--nav-height);
        }

        /* 导航栏样式（与首页一致） */
        .navbar {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: var(--nav-height);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 40px;
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.1);
            z-index: 1000;
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 12px;
            font-weight: 700;
            font-size: 1.4rem;
            color: var(--dark);
        }

        .logo-img {
            height: 45px;
            width: auto;
            border-radius: 8px;
        }

        .nav-links {
            display: flex;
            gap: 15px;
        }

        .nav-link {
            text-decoration: none;
            padding: 8px 18px;
            border-radius: 30px;
            font-weight: 500;
            color: var(--dark);
            transition: all 0.3s ease;
            background: rgba(255, 255, 255, 0.7);
            border: 1px solid rgba(0, 0, 0, 0.05);
        }

        .nav-link:hover, .nav-link.active {
            background: var(--primary);
            color: white;
        }

        /* 页面主体 */
        .page {
            width: min(100%, 760px);
            margin: 0 auto;
            padding: 32px 20px 48px;
        }

        .section-title {
            color: var(--dark);
            font-size: 1.45rem;
            text-align: center;
            margin-bottom: 4px;
        }

        .section-hint {
            color: #a0607f;
            font-size: 0.9rem;
            text-align: center;
            margin-bottom: 20px;
        }

        /* 每日抽奖 */
        .lottery {
            display: flex;
            flex-direction: column;
            align-items: center;
            margin-bottom: 44px;
            /* 转盘旋转时外接方框会变大（对角线），裁掉以免手机端页面被撑宽 */
            overflow: hidden;
        }

        .ticket {
            display: flex;
            align-items: center;
            gap: 10px;
            margin: 14px 0 26px;
            padding: 10px 22px;
            border: 2px dashed #ff8cc6;
            border-radius: 14px;
            background: #fffdf8;
            color: var(--dark);
            font-weight: 600;
        }

        .ticket.empty {
            border-color: #e3cbd7;
            color: #b88aa1;
        }

        .ticket-count {
            padding: 2px 10px;
            border-radius: 20px;
            background: var(--primary);
            color: white;
            font-size: 0.9rem;
        }

        .ticket.empty .ticket-count {
            background: #d9c2cd;
        }

        /* 转盘：扇区只显示问号，转停后才揭晓指针所指的那一格 */
        .wheel-wrap {
            position: relative;
            width: min(80vw, 320px);
            aspect-ratio: 1;
        }

        .pointer {
            position: absolute;
            left: 50%;
            top: -14px;
            width: 0;
            height: 0;
            border-left: 15px solid transparent;
            border-right: 15px solid transparent;
            border-top: 30px solid var(--dark);
            transform: translateX(-50%);
            filter: drop-shadow(0 3px 3px rgba(0, 0, 0, 0.25));
            z-index: 2;
        }

        .wheel {
            position: absolute;
            inset: 0;
            border-radius: 50%;
            border: 8px solid white;
            box-shadow: 0 16px 36px rgba(109, 0, 57, 0.22);
            transition: transform 4.8s cubic-bezier(0.15, 0.7, 0.12, 1);
        }

        .slice-label {
            position: absolute;
            inset: 0;
            pointer-events: none;
        }

        .slice-label span {
            position: absolute;
            left: 50%;
            top: 9%;
            transform: translateX(-50%);
            color: white;
            font-size: 1.5rem;
            font-weight: 700;
            text-shadow: 0 1px 3px rgba(109, 0, 57, 0.35);
            white-space: nowrap;
            transition: all 0.4s ease;
        }

        .slice-label.revealed span {
            top: 11%;
            padding: 3px 8px;
            border-radius: 10px;
            background: white;
            color: var(--primary);
            font-size: 0.85rem;
            text-shadow: none;
            box-shadow: 0 4px 10px rgba(109, 0, 57, 0.25);
        }

        .spin-button {
            position: absolute;
            left: 50%;
            top: 50%;
            width: 76px;
            height: 76px;
            border: 5px solid white;
            border-radius: 50%;
            background: var(--primary);
            color: white;
            font-size: 1.15rem;
            font-weight: 700;
            transform: translate(-50%, -50%);
            box-shadow: 0 6px 16px rgba(109, 0, 57, 0.3);
            cursor: pointer;
            z-index: 2;
        }

        .spin-button:disabled {
            background: #d9c2cd;
            cursor: default;
        }

        .lottery-result {
            display: none;
            margin-top: 24px;
            padding: 16px 22px;
            border-radius: 16px;
            background: #fffdf8;
            box-shadow: 0 12px 28px rgba(109, 0, 57, 0.12);
            text-align: center;
            color: var(--dark);
        }

        .lottery-result.show {
            display: block;
            animation: pop 0.5s ease;
        }

        .lottery-result strong {
            display: block;
            font-size: 1.2rem;
            margin-bottom: 4px;
        }

        .lottery-result small {
            color: #a0607f;
        }

        /* 我的兑换券 */
        .coupons {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 16px;
        }

        .coupons-empty {
            grid-column: 1 / -1;
            padding: 22px;
            border-radius: 14px;
            background: rgba(255, 255, 255, 0.55);
            color: #a0607f;
            text-align: center;
        }

        .coupon {
            position: relative;
            display: flex;
            align-items: center;
            gap: 12px;
            min-height: 96px;
            padding: 14px 16px 14px 18px;
            border: none;
            border-radius: 14px;
            background-color: white;
            box-shadow: 0 8px 20px rgba(109, 0, 57, 0.1);
            border-left: 6px solid var(--primary);
            text-align: left;
            cursor: pointer;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }

        .coupon:hover {
            transform: translateY(-2px);
            box-shadow: 0 12px 24px rgba(109, 0, 57, 0.16);
        }

        .coupon.fresh {
            animation: glow 1.4s ease 2;
        }

        @keyframes glow {
            0%, 100% { box-shadow: 0 8px 20px rgba(109, 0, 57, 0.1); }
            50% { box-shadow: 0 0 0 4px rgba(255, 59, 141, 0.45), 0 12px 26px rgba(255, 59, 141, 0.35); }
        }

        .coupon-icon {
            font-size: 2rem;
            flex-shrink: 0;
        }

        .coupon-title {
            color: var(--dark);
            font-weight: 700;
            font-size: 1.02rem;
            margin-bottom: 4px;
        }

        .coupon-desc {
            color: #8a5a72;
            font-size: 0.82rem;
            line-height: 1.45;
        }

        .coupon-date {
            color: #b88aa1;
            font-size: 0.75rem;
            margin-top: 4px;
        }

        .coupon.used {
            border-left-color: #c9b3be;
            background-color: #f7f1f4;
        }

        .coupon.used .coupon-icon,
        .coupon.used .coupon-title,
        .coupon.used .coupon-desc,
        .coupon.used .coupon-date {
            opacity: 0.45;
        }

        .coupon.used::after {
            content: "已兑换";
            position: absolute;
            right: 12px;
            top: 50%;
            padding: 2px 10px;
            border: 2px solid #c0306f;
            border-radius: 8px;
            color: #c0306f;
            font-weight: 700;
            font-size: 0.9rem;
            transform: translateY(-50%) rotate(-14deg);
            opacity: 0.8;
        }

        /* 兑换弹窗 */
        .modal {
            position: fixed;
            inset: 0;
            display: none;
            align-items: center;
            justify-content: center;
            padding: 20px;
            background: rgba(109, 0, 57, 0.35);
            z-index: 2000;
        }

        .modal.show {
            display: flex;
        }

        .modal-card {
            width: min(100%, 360px);
            padding: 28px 24px 22px;
            border-radius: 20px;
            background: white;
            text-align: center;
            animation: pop 0.35s ease;
        }

        .modal-icon {
            font-size: 3.4rem;
            margin-bottom: 8px;
        }

        .modal-title {
            color: var(--dark);
            font-size: 1.4rem;
            margin-bottom: 6px;
        }

        .modal-desc {
            color: #8a5a72;
            margin-bottom: 18px;
            line-height: 1.5;
        }

        .modal-tip {
            padding: 10px 12px;
            border-radius: 12px;
            background: #fff0f6;
            color: #c0306f;
            font-size: 0.9rem;
            margin-bottom: 20px;
        }

        .modal-actions {
            display: flex;
            gap: 12px;
            justify-content: center;
        }

        .pill-button {
            padding: 10px 22px;
            border: none;
            border-radius: 30px;
            font-size: 0.95rem;
            font-weight: 600;
            cursor: pointer;
        }

        .pill-button.primary {
            background: var(--primary);
            color: white;
            box-shadow: 0 8px 18px rgba(255, 59, 141, 0.3);
        }

        .pill-button.ghost {
            background: #f5eef2;
            color: var(--dark);
        }

        @keyframes pop {
            0% { transform: scale(0.85); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }

        /* 响应式设计：手机端 5 个入口排成 3 + 2，第二行居中 */
        @media (max-width: 768px) {
            :root {
                --nav-height: 142px;
            }

            .navbar {
                align-items: stretch;
                justify-content: center;
                flex-direction: column;
                gap: 8px;
                padding: 10px 12px 12px;
            }

            .logo {
                justify-content: center;
                font-size: 0.95rem;
                gap: 8px;
            }

            .logo-img {
                height: 32px;
            }

            .nav-links {
                flex-wrap: wrap;
                justify-content: center;
                gap: 8px;
                width: min(100%, 430px);
                margin: 0 auto;
            }

            .nav-link {
                flex: 0 0 calc((100% - 16px) / 3); /* 固定 1/3 宽，始终 3 + 2 两行 */
                display: flex;
                align-items: center;
                justify-content: center;
                min-height: 34px;
                padding: 7px 4px;
                border-radius: 12px;
                font-size: min(0.82rem, 3.4vw);
                line-height: 1.15;
                white-space: nowrap;
            }

            .page {
                padding: 24px 14px 40px;
            }

            .coupons {
                grid-template-columns: 1fr;
                gap: 12px;
            }
        }
    </style>
</head>

<body>
    <nav class="navbar">
        <div class="logo">
            <img src="./images2/logo.png" alt="Logo" class="logo-img">
            <span>Always Following dxy</span>
        </div>
        <div class="nav-links">
            <a href="index.html?skipIntro=1" class="nav-link">首页</a>
            <a href="game.html" class="nav-link">互动小游戏</a>
            <a href="heart.html" class="nav-link">瞅瞅金博的心脏</a>
            <a href="message.html" class="nav-link">给金博递纸条</a>
            <a href="fortune.html" class="nav-link active">每日抽奖</a>
        </div>
    </nav>

    <main class="page">
        <section class="lottery">
            <h1 class="section-title">dxy 的每日抽奖 🎡</h1>
            <p class="section-hint">每天送你一张抽奖券，转到什么就是什么</p>

            <div class="ticket" id="ticket">
                <span>🎫 今日抽奖券</span>
                <span class="ticket-count" id="ticketCount">× 1</span>
            </div>

            <div class="wheel-wrap">
                <div class="pointer" aria-hidden="true"></div>
                <div class="wheel" id="wheel" aria-hidden="true"></div>
                <button type="button" class="spin-button" id="spinButton">抽！</button>
            </div>

            <div class="lottery-result" id="lotteryResult" aria-live="polite"></div>
        </section>

        <section>
            <h2 class="section-title">我的兑换券 🎟️</h2>
            <p class="section-hint">点开想用的券，截图发给金博就能兑换</p>
            <div class="coupons" id="coupons"></div>
        </section>
    </main>

    <div class="modal" id="couponModal" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
        <div class="modal-card">
            <div class="modal-icon" id="modalIcon"></div>
            <h3 class="modal-title" id="modalTitle"></h3>
            <p class="modal-desc" id="modalDesc"></p>
            <p class="modal-tip" id="modalTip"></p>
            <div class="modal-actions">
                <button type="button" class="pill-button ghost" id="modalClose">先留着</button>
                <button type="button" class="pill-button primary" id="modalRedeem">我已兑换</button>
            </div>
        </div>
    </div>

    <script>
        // 奖品：short 是转停后在扇区上揭晓的短名
        const PRIZES = {
            milktea: { icon: "🧋", title: "奶茶券", short: "奶茶券", desc: "金博请喝奶茶一杯，甜度随你挑" },
            song: { icon: "🎤", title: "点歌券", short: "点歌券", desc: "指定一首歌，金博认真唱给你听" },
            sad: { icon: "🥺", title: "八卦券（伤心的事）", short: "伤心八卦", desc: "金博讲一件他伤心的事，不许敷衍" },
            happy: { icon: "😆", title: "八卦券（开心的事）", short: "开心八卦", desc: "金博讲一件他开心的事，越详细越好" }
        };

        // 转盘 10 格，概率 = 格数 / 10：奶茶 20%、点歌 20%、伤心八卦 30%、开心八卦 30%；同类不相邻
        const SLICES = ["happy", "milktea", "sad", "happy", "song", "sad", "happy", "milktea", "sad", "song"];
        const SLICE_ANGLE = 360 / SLICES.length;
        const SLICE_COLORS = ["#ff5c9d", "#ff9cc7"];

        // 本机存储：今日抽奖 { date, slice }，兑换券 [{ id, kind, date, used }]
        const LOTTERY_KEY = "dxy_lottery";
        const WALLET_KEY = "dxy_wallet";

        const wheel = document.getElementById("wheel");
        const spinButton = document.getElementById("spinButton");
        const resultBox = document.getElementById("lotteryResult");
        const couponList = document.getElementById("coupons");
        const modal = document.getElementById("couponModal");

        function loadJSON(key, fallback) {
            try {
                return JSON.parse(localStorage.getItem(key)) ?? fallback;
            } catch {
                return fallback;
            }
        }

        function saveJSON(key, value) {
            localStorage.setItem(key, JSON.stringify(value));
        }

        function todayKey() {
            const d = new Date();
            return `${d.getFullYear()}-${d.getMonth() + 1}-${d.getDate()}`;
        }

        function dateLabel(key) {
            const [, month, day] = key.split("-");
            return `${month} 月 ${day} 日获得`;
        }

        let wallet = loadJSON(WALLET_KEY, []);
        let rotation = 0;

        // ---------- 转盘 ----------
        function buildWheel() {
            const stops = SLICES.map((_, i) =>
                `${SLICE_COLORS[i % 2]} ${i * SLICE_ANGLE}deg ${(i + 1) * SLICE_ANGLE}deg`);
            wheel.style.background = `conic-gradient(${stops.join(", ")})`;
            SLICES.forEach((_, i) => {
                const label = document.createElement("div");
                label.className = "slice-label";
                label.style.transform = `rotate(${i * SLICE_ANGLE + SLICE_ANGLE / 2}deg)`;
                label.innerHTML = "<span>?</span>";
                wheel.appendChild(label);
            });
        }

        function revealSlice(index) {
            const label = wheel.children[index];
            label.classList.add("revealed");
            label.firstChild.textContent = PRIZES[SLICES[index]].short;
        }

        // 让第 index 格的中心对准顶部指针
        function rotationFor(index, extraTurns) {
            const center = index * SLICE_ANGLE + SLICE_ANGLE / 2;
            const jitter = (Math.random() - 0.5) * SLICE_ANGLE * 0.6;
            const target = ((-center - rotation) % 360 + 360) % 360;
            return rotation + extraTurns * 360 + target + jitter;
        }

        function showResult(kind, isToday) {
            const prize = PRIZES[kind];
            resultBox.innerHTML = `<strong>${isToday ? "🎉 抽中了" : "今天抽中了"} ${prize.icon} ${prize.title}</strong><small>已经放进下面的兑换券里啦，明天再来领新的抽奖券～</small>`;
            resultBox.classList.add("show");
        }

        function setTicketUsed() {
            document.getElementById("ticket").classList.add("empty");
            document.getElementById("ticketCount").textContent = "× 0";
            spinButton.disabled = true;
            spinButton.textContent = "明天见";
        }

        spinButton.addEventListener("click", () => {
            if (spinButton.disabled) return;
            spinButton.disabled = true;

            const index = Math.floor(Math.random() * SLICES.length);
            const kind = SLICES[index];
            const today = todayKey();
            // 先记下结果，转到一半关掉页面也不会丢券或重抽
            saveJSON(LOTTERY_KEY, { date: today, slice: index });
            const coupon = { id: Date.now(), kind, date: today, used: false };
            wallet.unshift(coupon);
            saveJSON(WALLET_KEY, wallet);

            rotation = rotationFor(index, 6);
            wheel.style.transform = `rotate(${rotation}deg)`;
            wheel.addEventListener("transitionend", function onStop() {
                wheel.removeEventListener("transitionend", onStop);
                revealSlice(index);
                setTicketUsed();
                showResult(kind, true);
                renderCoupons(coupon.id);
            });
        });

        // ---------- 我的兑换券 ----------
        function renderCoupons(freshId = null) {
            couponList.innerHTML = "";
            if (wallet.length === 0) {
                couponList.innerHTML = `<div class="coupons-empty">还没有兑换券，快去转盘试试手气吧～</div>`;
                return;
            }
            wallet.forEach((coupon) => {
                const prize = PRIZES[coupon.kind];
                const item = document.createElement("button");
                item.type = "button";
                item.className = "coupon" + (coupon.used ? " used" : "") + (coupon.id === freshId ? " fresh" : "");
                item.innerHTML = `<span class="coupon-icon">${prize.icon}</span><span><div class="coupon-title">${prize.title}</div><div class="coupon-desc">${prize.desc}</div><div class="coupon-date">${dateLabel(coupon.date)}</div></span>`;
                item.addEventListener("click", () => openCoupon(coupon));
                couponList.appendChild(item);
            });
        }

        let activeCoupon = null;

        function openCoupon(coupon) {
            const prize = PRIZES[coupon.kind];
            activeCoupon = coupon;
            document.getElementById("modalIcon").textContent = prize.icon;
            document.getElementById("modalTitle").textContent = prize.title;
            document.getElementById("modalDesc").textContent = prize.desc;
            document.getElementById("modalTip").textContent = coupon.used
                ? "这张券已经兑换过啦，金博说到做到 ✓"
                : "📸 截图发给金博，就能兑换啦";
            document.getElementById("modalRedeem").style.display = coupon.used ? "none" : "";
            document.getElementById("modalClose").textContent = coupon.used ? "好的" : "先留着";
            modal.classList.add("show");
        }

        function closeModal() {
            modal.classList.remove("show");
            activeCoupon = null;
        }

        document.getElementById("modalClose").addEventListener("click", closeModal);
        modal.addEventListener("click", (event) => {
            if (event.target === modal) closeModal();
        });
        document.getElementById("modalRedeem").addEventListener("click", () => {
            if (activeCoupon) {
                activeCoupon.used = true;
                saveJSON(WALLET_KEY, wallet);
            }
            closeModal();
            renderCoupons();
        });

        // ---------- 初始化 ----------
        buildWheel();
        const todayRecord = loadJSON(LOTTERY_KEY, null);
        if (todayRecord && todayRecord.date === todayKey()) {
            // 今天已经抽过：转盘直接停在结果上
            wheel.style.transition = "none";
            rotation = rotationFor(todayRecord.slice, 0);
            wheel.style.transform = `rotate(${rotation}deg)`;
            revealSlice(todayRecord.slice);
            setTicketUsed();
            showResult(SLICES[todayRecord.slice], false);
        }
        renderCoupons();
    </script>
</body>

</html>
