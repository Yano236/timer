    }
    .logo {
      display: flex;

    .nav-link {

      border-radius: 30px;
      font-weight: 500;
      color: var(--dark);
      transition: all 0.3s ease;

    /* 手机端：logo 一行，5 个入口排成 3 + 2，第二行居中 */

      :root { --nav-height: 142px; }
      .navbar { flex-direction: column; align-items: stretch; justify-content: center; gap: 8px; padding: 10px 12px 12px; }
      .logo { justify-content: center; font-size: 0.95rem; gap: 8px; }
      .logo-img { height: 32px; }
      .nav-links { display: flex; flex-wrap: wrap; justify-content: center; gap: 8px; width: min(100%, 430px); margin: 0 auto; }

  <div id="main"></div>
  <script type="text/javascript">
    //获取父容器
    var mainObj = document.getElementById('main')
    //获取浏览器的高度
    var innerWidth = document.body.clientWidth
    var innerHeight = document.body.clientHeight
    
    //计数器
    var number = 0
    
    /**
     * 位置随机生成
     */
    var interval = setInterval(function() {
        var heart = document.createElement('heart');
        heart.style.left = Math.floor(Math.random() * innerWidth) + 'px';
        heart.style.top = Math.floor(Math.random() * innerHeight) + 'px';
        heart.style.opacity = '0'; // 初始完全透明
        mainObj.appendChild(heart);
        
        // 立即开始淡入
        var fadeInDuration = 2000; // 淡入1秒
        var fadeOutDuration = 2000; // 淡出3秒
        var totalDuration = fadeInDuration + fadeOutDuration;
        var startTime = Date.now();
        
        function animate() {
            var elapsed = Date.now() - startTime;
            var progress = elapsed / totalDuration;
            
            if (progress < 1) {
                // 前1秒淡入，后3秒淡出
                if (elapsed < fadeInDuration) {
                    // 淡入阶段：透明度从0到1
                    heart.style.opacity = (elapsed / fadeInDuration).toFixed(3);
                } else {
                    // 淡出阶段：透明度从1到0
                    heart.style.opacity = (1 - (elapsed - fadeInDuration) / fadeOutDuration).toFixed(3);
                }
                requestAnimationFrame(animate);
            } else {
                // 动画完成后移除元素并减少计数器
                if(heart.parentNode) {
                    mainObj.removeChild(heart);
                    number--;
                }
            }
        }
        
        requestAnimationFrame(animate);
        
        number++;
        if (number >= 520) {
            clearInterval(interval);
        }
    }, 50);
  </script>
