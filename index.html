<html>

<head>

    <style>
        /* 原CSS文件内容开始 */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body,
        html {
            margin: 0;
            padding: 0;
            height: 100%;
            overflow: hidden;
        }

        body {
            font-family: 'Poppins', sans-serif;
        }

        /* 全屏 Loading 遮罩 */
        #loading-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background:
                radial-gradient(circle at 50% 42%, #ffffff 0 18%, rgba(255, 252, 245, 0.82) 42%, transparent 68%),
                linear-gradient(135deg, #fbf3e7 0%, #edf7f2 50%, #f8e9ee 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            flex-direction: column;
            font-size: 2rem;
            font-weight: bold;
            color: #5e1230;
            z-index: 9999;
            overflow: hidden;
            /* 最后 0.3 秒淡出，包含在固定的 3 秒开场中。 */
            transition: opacity 0.3s ease-out, visibility 0.3s ease-out, transform 0.3s ease-out;
        }

        #loading-screen::before,
        #loading-screen::after {
            content: "";
            position: absolute;
            inset: -18%;
            pointer-events: none;
            z-index: 0;
        }

        #loading-screen::before {
            background:
                linear-gradient(115deg, transparent 0 22%, rgba(255, 255, 255, 0.58) 34%, transparent 47%),
                radial-gradient(circle, rgba(111, 155, 144, 0.12) 2px, transparent 3px) 0 0 / 32px 32px;
            animation: openingSheen 6s ease-in-out infinite;
        }

        #loading-screen::after {
            background:
                radial-gradient(circle at center, transparent 0 43%, rgba(210, 181, 137, 0.12) 62%, rgba(112, 189, 180, 0.08) 74%, transparent 76%);
            animation: openingHalo 4.8s ease-in-out infinite;
        }

        /* 隐藏 loading 画面 */
        #loading-screen.hidden {
            opacity: 0;
            visibility: hidden;
            transform: scale(1.02);
        }

        /* 包裹容器 */
        .loading-content {
            position: absolute;
            inset: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            width: 100%;
            height: 100%;
            isolation: isolate;
            z-index: 1;
        }

        /* 积木宫殿与文字上下排列，搭建过程完整可见 */
        #palaceCanvas {
            width: min(80vw, 64vh, 560px);
            aspect-ratio: 5 / 4;
            display: block;
            margin-bottom: 8px;
            filter: drop-shadow(0 20px 26px rgba(111, 135, 126, 0.12));
        }

        /* 加载文字容器 */
        .loading-text {
            position: relative;
            text-align: center;
            width: min(82vw, 500px);
            padding: 28px 34px 24px;
            border: 1px solid rgba(255, 255, 255, 0.68);
            border-radius: 28px;
            background: rgba(255, 255, 255, 0.42);
            box-shadow: 0 24px 70px rgba(255, 66, 136, 0.14), inset 0 1px 0 rgba(255, 255, 255, 0.8);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
        }

        /* 主标题文字 - 使用更浪漫的手写字体 */
        .main-text {
            font-family: 'Dancing Script', 'Pacifico', cursive;
            font-size: clamp(1.5rem, 2.4vw, 1.9rem);
            color: #6d0039;
            font-weight: 700;
            margin-bottom: 14px;
            text-shadow: 0 8px 24px rgba(255, 255, 255, 0.9);
            letter-spacing: 0;
            white-space: normal;
            animation: textGlow 2.4s ease-in-out infinite;
        }

        /* 进度文字 */
        .progress-text {
            font-family: 'Poppins', sans-serif;
            position: relative;
            display: inline-flex;
            min-width: 148px;
            justify-content: center;
            padding: 9px 18px;
            border-radius: 999px;
            background: rgba(255, 255, 255, 0.74);
            color: #8b2451;
            font-size: clamp(0.86rem, 2vw, 1.02rem);
            font-weight: 600;
            line-height: 1.2;
            box-shadow: 0 10px 26px rgba(255, 80, 145, 0.13);
            text-shadow: 0 1px 2px rgba(255, 255, 255, 0.9);
        }

        @keyframes openingSheen {
            0%, 100% {
                transform: translateX(-5%) rotate(0.001deg);
                opacity: 0.55;
            }
            50% {
                transform: translateX(5%) rotate(0.001deg);
                opacity: 0.9;
            }
        }

        @keyframes openingHalo {
            0%, 100% {
                transform: scale(0.98);
                opacity: 0.64;
            }
            50% {
                transform: scale(1.06);
                opacity: 1;
            }
        }

        @keyframes textGlow {
            0%, 100% {
                filter: drop-shadow(0 0 0 rgba(255, 88, 148, 0));
            }
            50% {
                filter: drop-shadow(0 10px 18px rgba(255, 88, 148, 0.18));
            }
        }

        /* Loading 文字 */
        .loading-text {
            text-align: center;
        }

        /* 添加白色蒙版 */
        section::before {
            content: "";
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.2);
            z-index: 1;
        }

        /* 居中文字 */
        .overlay-div {
            width: 100%;
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: rgb(255, 255, 255);
            z-index: 2;
            text-align: center;
            vertical-align: middle;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }

        .overlay-text {
            font-weight: bold;
            font-size: 5vw;
        }

        .small-font {
            font-size: 2vw;
        }

        section {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;

        section {

        h1 {

            font-size: 3vw;
            text-transform: capitalize;
        }

        .images-gallery {
            position: relative;
            overflow: hidden;
            /* 隐藏滚动条 */
            height: 100vh;
        }

        /* 照片轨道：用 transform 整体上移，滚动不触发重排 */
        .gallery-track {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            will-change: transform;
        }

        /* 照片按预先算好的位置和尺寸绝对定位，加载前后不跳动 */
        .gallery-item {
            position: absolute;
            display: block;
            object-fit: cover;
            background: #f6dbe4;
        }

        @media screen and (max-width: 768px) {
            .overlay-text {
                font-size: 7vw;
            }
            .images-gallery {

            }

        /* 原CSS文件内容结束 */

        /* 原HTML中的style内容 */

    <script>
        var startTime = new Date("2026-09-28T20:57:00").getTime() / 1000 - 86400; // 目标时间
        let body = document.body;
        var flipdown = new FlipTimer(startTime).start()
        body.querySelector('#fliptimer').classList.toggle('fliptimer__theme-light');

        document.addEventListener("DOMContentLoaded", function () {
            const gallery = document.getElementById("images-gallery");
            const track = document.getElementById("gallery-track");
            const loadingScreen = document.getElementById("loading-screen");
            const shouldSkipIntro = new URLSearchParams(window.location.search).get("skipIntro") === "1";

            const isMobileViewport = window.matchMedia("(max-width: 768px)").matches;
            const scrollSpeed = isMobileViewport ? 18 : 42; // px/s
            let scrollPosition = 0; // 记录当前滚动位置
            let lastScrollTime = null;
            let isLoaded = false; // 是否已进入首页

            const canvas = document.getElementById("palaceCanvas");
            const ctx = canvas.getContext("2d");
            const canvasWidth = 600;
            const canvasHeight = 480;
            const dpr = Math.min(window.devicePixelRatio || 1, 1.5);
            canvas.width = canvasWidth * dpr;
            canvas.height = canvasHeight * dpr;
            ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
            const reducedMotion = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
            let progressValue = 0;
            let displayedProgress = -1;
            let isIntroAnimating = !shouldSkipIntro;
            let photosSettled = 0;
            let photosLoaded = 0;
            let loadingStartTime = performance.now();
            const loadingDuration = 3000; // 固定开场时长，不等待照片网络请求
            const introFadeDuration = 300; // 淡出也计入开场时长

            const blockColors = [
                { front: "#dba1ad", top: "#efbec8", side: "#bd7e8c" },
                { front: "#91bfb2", top: "#b8dace", side: "#709d91" },
                { front: "#e1c394", top: "#f4deb9", side: "#bd9e72" },
                { front: "#9eafcd", top: "#c0cce1", side: "#7b90b2" }
            ];
            const blocks = [];
            // 从地基向上搭起两座塔楼，中央留出宫殿入口。
            for (let row = 0; row < 7; row++) {
                for (let column = 0; column < 8; column++) {
                    const tower = column < 2 || column > 5;
                    if (row < 2 && (column === 3 || column === 4)) continue;
                    if (row > 4 && !tower && !(row === 5 && (column === 3 || column === 4))) continue;
                    blocks.push({
                        x: 88 + column * 52,
                        y: 366 - row * 39,
                        color: blockColors[tower ? (row % 2 === 0 ? 0 : 2) : (row % 2 === 0 ? 1 : 3)]
                    });
                }
            }

            function drawBlock(x, y, width, height, color, alpha = 1) {
                ctx.save();
                ctx.globalAlpha = alpha;
                ctx.fillStyle = color.top;
                ctx.beginPath();
                ctx.moveTo(x, y);
                ctx.lineTo(x + 8, y - 8);
                ctx.lineTo(x + width + 8, y - 8);
                ctx.lineTo(x + width, y);
                ctx.closePath();
                ctx.fill();
                ctx.fillStyle = color.side;
                ctx.beginPath();
                ctx.moveTo(x + width, y);
                ctx.lineTo(x + width + 8, y - 8);
                ctx.lineTo(x + width + 8, y + height - 8);
                ctx.lineTo(x + width, y + height);
                ctx.closePath();
                ctx.fill();
                ctx.fillStyle = color.front;
                ctx.beginPath();
                ctx.roundRect(x, y, width, height, 3);
                ctx.fill();
                // 顶部凸点让每一块都像真正的拼插积木。
                for (let stud = 0; stud < Math.min(8, Math.round(width / 24)); stud++) {
                    const studX = x + 15 + stud * (width - 24) / Math.max(1, Math.min(8, Math.round(width / 24)) - 1);
                    ctx.fillStyle = color.side;
                    ctx.beginPath();
                    ctx.ellipse(studX, y - 5, 7, 3.5, 0, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.fillStyle = color.top;
                    ctx.beginPath();
                    ctx.ellipse(studX, y - 8, 7, 3.5, 0, 0, Math.PI * 2);
                    ctx.fill();
                }
                ctx.restore();
            }

            function drawPalace() {
                ctx.clearRect(0, 0, canvasWidth, canvasHeight);
                ctx.fillStyle = "rgba(100, 130, 119, 0.1)";
                ctx.beginPath();
                ctx.ellipse(305, 421, 238, 20, 0, 0, Math.PI * 2);
                ctx.fill();
                drawBlock(68, 408, 460, 16, blockColors[1]);
                // 淡淡的施工轮廓，随着积木落下被填满。
                ctx.save();
                ctx.strokeStyle = "rgba(129, 153, 144, 0.18)";
                ctx.setLineDash([4, 6]);
                blocks.forEach((block) => ctx.strokeRect(block.x, block.y, 48, 34));
                ctx.restore();
                const built = progressValue * blocks.length;
                blocks.forEach((block, index) => {
                    const local = Math.min(1, Math.max(0, built - index));
                    if (local <= 0) return;
                    const fall = reducedMotion ? 0 : Math.pow(1 - local, 3) * 125;
                    drawBlock(block.x, block.y - fall, 48, 34, block.color, Math.min(1, local * 3));
                });
                if (progressValue < 0.99 && !reducedMotion) {
                    const next = blocks[Math.floor(built)];
                    if (next) drawBlock(next.x, next.y - 145 + Math.sin(performance.now() / 450) * 5, 48, 34, next.color, 0.18);
                }
                // 最后一块落下后，宫殿入口亮起暖光。
                if (progressValue > 0.94) {
                    ctx.fillStyle = `rgba(241, 196, 104, ${(progressValue - 0.94) / 0.06 * 0.35})`;
                    ctx.beginPath();
                    ctx.roundRect(244, 329, 100, 72, [24, 24, 0, 0]);
                    ctx.fill();
                }
            }

            function revealGallery() {
                isIntroAnimating = false;
                loadingScreen.classList.add("hidden");
                isLoaded = true;
                requestAnimationFrame(autoScroll);
            }

            function renderIntro() {
                if (!isIntroAnimating) return;
                progressValue = Math.min(1, (performance.now() - loadingStartTime) / (loadingDuration - introFadeDuration));
                updateLoadingText(Math.floor(progressValue * 100));
                drawPalace();
                if (progressValue < 1) {
                    requestAnimationFrame(renderIntro);
                    return;
                }
                finishIntro();
            }

            function finishIntro() {
                if (!isIntroAnimating) return;
                progressValue = 1;
                updateLoadingText(100);
                drawPalace();
                revealGallery();
            }

            // 照片高宽比（images/photo1.jpg ~ photoN.jpg），用于加载前就排好版，避免图片加载后跳动
            const PHOTO_RATIOS = [
                1.333, 0.750, 0.751, 1.000, 1.333, 1.333, 1.333, 1.333, 1.332, 1.332, 1.333, 1.333, 1.501, 1.333, 1.332, 1.333, 1.333, 1.332, 1.333, 1.332, 1.335, 1.333, 1.333, 1.357, 1.333, 0.734, 1.332, 1.333, 1.333, 1.332, 1.333, 1.332, 0.738, 1.333, 0.750, 0.751, 1.333, 0.861, 1.333
            ];
            const photoUrls = PHOTO_RATIOS.map((_, i) => `./images/photo${i + 1}.jpg`);
            const GALLERY_GAP = 2; // 照片间距 px
            const BUFFER_SCREENS = 2; // 提前排好下方两屏，留足加载和解码时间

            let columnCount = 3;
            let columnWidth = 0;
            let columnHeights = [];
            let viewportHeight = 0;
            let galleryItems = []; // 屏幕内及下方缓冲区的照片：{ index, bottom, el }
            const lastShownAt = new Array(photoUrls.length).fill(0);
            let placedCount = 0;
            const photoCache = new Map(); // 保留预加载图片，复用浏览器缓存和解码结果

            function photoSource(index) {
                // 手机固定使用 600px 版本；桌面根据显示尺寸选择，预加载与实际展示使用相同 URL。
                const useThumbnail = window.matchMedia("(max-width: 768px)").matches ||
                    columnWidth * (window.devicePixelRatio || 1) <= 600;
                return useThumbnail ? photoUrls[index].replace("/images/", "/images/thumb/") : photoUrls[index];
            }

            function preloadPhoto(index) {
                const source = photoSource(index);
                if (photoCache.has(source)) return photoCache.get(source).promise;
                const image = new Image();
                image.decoding = "async";
                const entry = { image, status: "loading", promise: null };
                entry.promise = new Promise((resolve) => {
                    image.onload = async () => {
                        try {
                            await image.decode();
                            entry.status = "ready";
                            resolve(true);
                        } catch {
                            entry.status = "error";
                            resolve(false);
                        }
                    };
                    image.onerror = () => {
                        entry.status = "error";
                        resolve(false);
                    };
                    image.src = source;
                });
                photoCache.set(source, entry);
                return entry.promise;
            }

            async function preloadPhotos() {
                const initial = [...new Set(galleryItems.map((item) => item.index))];
                const queue = [...initial, ...photoUrls.map((_, index) => index).filter((index) => !initial.includes(index))];
                let cursor = 0;
                async function worker() {
                    while (cursor < queue.length) {
                        const index = queue[cursor++];
                        if (await preloadPhoto(index)) photosLoaded++;
                        photosSettled++;
                    }
                }
                await Promise.all(Array.from({ length: 4 }, worker));
                if (photosLoaded > 0 && photosLoaded < photoUrls.length) {
                    // 个别照片失败时，重新用已缓存的照片排版，避免空白或损坏图片。
                    lastGalleryWidth = 0;
                    relayoutGallery();
                }
                // 在后台提前完成画廊节点解码，不阻塞固定时长的开场。
                await Promise.all(galleryItems.map((item) => item.el.decode().catch(() => {})));
            }

            // 手机端两列，电脑端三列；新照片从当前滚动位置开始排
            function layoutColumns() {
                columnCount = window.matchMedia("(max-width: 768px)").matches ? 2 : 3;
                columnWidth = (gallery.clientWidth - GALLERY_GAP * (columnCount - 1)) / columnCount;
                columnHeights = new Array(columnCount).fill(scrollPosition);
                viewportHeight = gallery.clientHeight;
            }

            // **选图：排除所有还在页面上的照片，再从最久没出现过的一半里随机挑，保证同屏不重复**
            function pickPhoto() {
                const onPage = new Set(galleryItems.map((item) => item.index));
                const available = photoUrls.map((_, i) => i).filter((i) => photoCache.get(photoSource(i))?.status !== "error");
                let candidates = available.filter((i) => !onPage.has(i));
                if (candidates.length === 0) candidates = available;
                candidates.sort((a, b) => lastShownAt[a] - lastShownAt[b]);
                const pool = candidates.slice(0, Math.max(1, Math.ceil(candidates.length / 2)));
                return pool[Math.floor(Math.random() * pool.length)];
            }

            // 新照片总是放进当前最短的一列，这样照片出现顺序和它在屏幕上的上下位置一致
            function addPhoto() {
                const column = columnHeights.indexOf(Math.min(...columnHeights));
                const index = pickPhoto();
                const top = columnHeights[column];
                const height = Math.round(columnWidth * PHOTO_RATIOS[index]);

                const img = document.createElement("img");
                img.className = "gallery-item";
                img.src = photoSource(index);
                img.alt = "";
                img.decoding = "async";
                img.loading = "eager";
                img.fetchPriority = isLoaded ? "auto" : "high";
                img.style.left = `${column * (columnWidth + GALLERY_GAP)}px`;
                img.style.top = `${top}px`;
                img.style.width = `${columnWidth}px`;
                img.style.height = `${height}px`;
                track.appendChild(img);
                // 窗口变宽需要更清晰的版本时，同样提前缓存。
                if (isLoaded) preloadPhoto(index);

                galleryItems.push({ index, bottom: top + height, el: img });
                columnHeights[column] = top + height + GALLERY_GAP;
                lastShownAt[index] = ++placedCount;
            }

            // 补齐屏幕下方的照片，回收已经滚出顶部的照片
            function fillGallery() {
                if (photosSettled === photoUrls.length && photosLoaded === 0) return;
                const targetBottom = scrollPosition + viewportHeight * (1 + BUFFER_SCREENS);
                while (Math.min(...columnHeights) < targetBottom) addPhoto();

                if (galleryItems.length && galleryItems[0].bottom < scrollPosition) {
                    galleryItems = galleryItems.filter((item) => {
                        if (item.bottom >= scrollPosition) return true;
                        item.el.remove();
                        return false;
                    });
                }
            }

            // 宽度变化（旋转屏幕等）时从当前位置重新排版；仅高度变化（手机地址栏收起）只更新缓冲高度
            let lastGalleryWidth = 0;
            function relayoutGallery() {
                if (gallery.clientWidth === lastGalleryWidth) {
                    viewportHeight = gallery.clientHeight;
                    return;
                }
                lastGalleryWidth = gallery.clientWidth;
                galleryItems.forEach((item) => item.el.remove());
                galleryItems = [];
                layoutColumns();
                fillGallery();
            }

            let resizeTimer = null;
            window.addEventListener("resize", () => {
                clearTimeout(resizeTimer);
                resizeTimer = setTimeout(relayoutGallery, 200);
            });

            // **更新加载文本**
            function updateLoadingText(percent) {
                if (displayedProgress === percent) return;
                displayedProgress = percent;
                const progressText = document.getElementById("progress-text");
                if (progressText) {
                    progressText.textContent = percent >= 100 ? "宫殿搭好啦 100%" : `搭建宫殿中... ${percent}%`;
                }
            }

            // 首屏先请求，再以四路并发预加载相册的其余照片。
            function initializeGallery() {
                relayoutGallery();
                loadingStartTime = performance.now();
                preloadPhotos();
                if (shouldSkipIntro) {
                    revealGallery();
                } else {
                    setTimeout(finishIntro, loadingDuration - introFadeDuration);
                }
            }

            // **2. 自动滚动：只移动轨道，顺带补图和回收**
            function autoScroll() {
                if (!isLoaded) return; // 开场结束前不滚动

                const now = performance.now();
                if (lastScrollTime === null) {
                    lastScrollTime = now;
                }
                const deltaSeconds = Math.min((now - lastScrollTime) / 1000, 0.05);
                lastScrollTime = now;

                const nextPosition = scrollPosition + scrollSpeed * deltaSeconds;
                const hasPendingPhoto = galleryItems.some((item) => {
                    const top = parseFloat(item.el.style.top);
                    return item.bottom > scrollPosition && top < nextPosition + viewportHeight + 100 &&
                        (!item.el.complete || item.el.naturalWidth === 0);
                });
                // 返回首页或旋转屏幕后，等即将入屏的图片准备好再滚动。
                if (!hasPendingPhoto) scrollPosition = nextPosition;
                track.style.transform = `translate3d(0, ${-scrollPosition}px, 0)`;
                fillGallery();

                requestAnimationFrame(autoScroll);
            }

            initializeGallery(); // 提前加载照片
            drawPalace();
            requestAnimationFrame(renderIntro);
        });
    </script>
</body>

</html>
