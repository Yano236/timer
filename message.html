<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <title>给金博递纸条 | Always Following dxy</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Poppins', 'Segoe UI', sans-serif;
        }

        :root {
            --primary: #ff3b8d;
            --secondary: #ff8cc6;
            --dark: #6d0039;
            --light: #fff9fb;
            --nav-height: 70px;
        }

        body {
            background: linear-gradient(135deg, #ffd8e9, #ffeef5);
            min-height: 100vh;
            color: #333;
            padding-top: var(--nav-height);
        }

        /* 导航栏样式（与首页一致） */
        .navbar {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: var(--nav-height);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 40px;
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.1);
            z-index: 1000;
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 12px;
            font-weight: 700;
            font-size: 1.4rem;
            color: var(--dark);
        }

        .logo-img {
            height: 45px;
            width: auto;
            border-radius: 8px;
        }

        .nav-links {
            display: flex;
            gap: 15px;
        }

        .nav-link {
            text-decoration: none;
            padding: 8px 18px;
            border-radius: 30px;
            font-weight: 500;
            color: var(--dark);
            transition: all 0.3s ease;
            background: rgba(255, 255, 255, 0.7);
            border: 1px solid rgba(0, 0, 0, 0.05);
        }

        .nav-link:hover, .nav-link.active {
            background: var(--primary);
            color: white;
        }

        /* 纸条 */
        .page {
            min-height: calc(100vh - var(--nav-height));
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 32px 20px;
        }

        .note {
            width: min(100%, 520px);
            padding: 30px 28px 26px;
            border-radius: 18px;
            background:
                repeating-linear-gradient(transparent 0 33px, rgba(255, 59, 141, 0.16) 33px 34px),
                #fffdf8;
            box-shadow: 0 18px 40px rgba(109, 0, 57, 0.14);
            transform: rotate(-1deg);
            transition: transform 0.6s ease, opacity 0.6s ease;
        }

        .note.sending {
            transform: rotate(-8deg) translateY(-40px) scale(0.6);
            opacity: 0;
        }

        .note h1 {
            color: var(--dark);
            font-size: 1.5rem;
            margin-bottom: 6px;
        }

        .note .hint {
            color: #a0607f;
            font-size: 0.9rem;
            margin-bottom: 18px;
        }

        .note textarea {
            width: 100%;
            min-height: 238px;
            resize: vertical;
            border: none;
            outline: none;
            background: transparent;
            font-size: 1.05rem;
            line-height: 34px;
            color: #4a2a3a;
        }

        .note .footer {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            margin-top: 14px;
        }

        .note .counter {
            color: #b88aa1;
            font-size: 0.85rem;
        }

        .send-button {
            padding: 11px 26px;
            border: none;
            border-radius: 30px;
            background: var(--primary);
            color: white;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            box-shadow: 0 8px 18px rgba(255, 59, 141, 0.3);
            transition: transform 0.2s ease, opacity 0.2s ease;
        }

        .send-button:hover {
            transform: translateY(-2px);
        }

        .send-button:disabled {
            opacity: 0.55;
            cursor: default;
            transform: none;
        }

        .status {
            min-height: 1.4em;
            margin-top: 12px;
            color: #c0306f;
            font-size: 0.9rem;
        }

        /* 递出去之后 */
        .delivered {
            display: none;
            text-align: center;
            color: var(--dark);
        }

        .delivered.show {
            display: block;
            animation: pop 0.5s ease;
        }

        .delivered .icon {
            font-size: 3.4rem;
            margin-bottom: 12px;
        }

        .delivered p {
            font-size: 1.2rem;
            font-weight: 600;
            margin-bottom: 22px;
        }

        /* 防机器人隐藏字段 */
        .botcheck {
            display: none;
        }

        @keyframes pop {
            0% { transform: scale(0.85); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }

        /* 响应式设计：手机端 5 个入口排成 3 + 2，第二行居中 */
        @media (max-width: 768px) {
            :root {
                --nav-height: 142px;
            }

            .navbar {
                align-items: stretch;
                justify-content: center;
                flex-direction: column;
                gap: 8px;
                padding: 10px 12px 12px;
            }

            .logo {
                justify-content: center;
                font-size: 0.95rem;
                gap: 8px;
            }

            .logo-img {
                height: 32px;
            }

            .nav-links {
                display: flex;
                flex-wrap: wrap;
                justify-content: center;
                gap: 8px;
                width: min(100%, 430px);
                margin: 0 auto;
            }

            .nav-link {
                flex: 0 0 calc((100% - 16px) / 3); /* 固定 1/3 宽，始终 3 + 2 两行 */
                display: flex;
                align-items: center;
                justify-content: center;
                min-height: 34px;
                padding: 7px 4px;
                border-radius: 12px;
                font-size: min(0.82rem, 3.4vw);
                line-height: 1.15;
                white-space: nowrap;
            }

            .note {
                padding: 24px 20px 20px;
            }

            .note textarea {
                min-height: 204px;
            }
        }
    </style>
</head>

<body>
    <nav class="navbar">
        <div class="logo">
            <img src="./images2/logo.png" alt="Logo" class="logo-img">
            <span>Always Following dxy</span>
        </div>
        <div class="nav-links">
            <a href="index.html?skipIntro=1" class="nav-link">首页</a>
            <a href="game.html" class="nav-link">互动小游戏</a>
            <a href="heart.html" class="nav-link">瞅瞅金博的心脏</a>
            <a href="message.html" class="nav-link active">给金博递纸条</a>
            <a href="fortune.html" class="nav-link">今日运势</a>
        </div>
    </nav>

    <main class="page">
        <form class="note" id="noteForm">
            <h1>给金博递张小纸条 ✉️</h1>
            <p class="hint">想说什么都可以，只有金博能看到哦</p>
            <textarea id="noteText" maxlength="1000" placeholder="写在这里……" required></textarea>
            <input type="checkbox" name="botcheck" class="botcheck" tabindex="-1" autocomplete="off">
            <div class="footer">
                <span class="counter" id="noteCounter">0 / 1000</span>
                <button type="submit" class="send-button" id="sendButton">折好，递出去</button>
            </div>
            <div class="status" id="noteStatus" role="status"></div>
        </form>

        <section class="delivered" id="delivered" aria-live="polite">
            <div class="icon">💌</div>
            <p>纸条已经递到金博手里啦</p>
            <button type="button" class="send-button" id="writeAgain">再写一张</button>
        </section>
    </main>

    <script>
        // Web3Forms 的 Access Key：只能往金博的邮箱发信，写在前端是安全的
        const WEB3FORMS_ACCESS_KEY = "dc95fc62-505b-4121-a9fb-6642bc9952bc";
        const DRAFT_KEY = "note_draft";

        const form = document.getElementById("noteForm");
        const textarea = document.getElementById("noteText");
        const counter = document.getElementById("noteCounter");
        const statusText = document.getElementById("noteStatus");
        const sendButton = document.getElementById("sendButton");
        const delivered = document.getElementById("delivered");

        // 草稿自动保存在本机，没发出去也不会丢
        textarea.value = localStorage.getItem(DRAFT_KEY) || "";
        updateCounter();
        textarea.addEventListener("input", () => {
            localStorage.setItem(DRAFT_KEY, textarea.value);
            updateCounter();
        });

        function updateCounter() {
            counter.textContent = `${textarea.value.length} / ${textarea.maxLength}`;
        }

        form.addEventListener("submit", async (event) => {
            event.preventDefault();
            const message = textarea.value.trim();
            if (!message) {
                statusText.textContent = "还什么都没写呢～";
                return;
            }

            sendButton.disabled = true;
            sendButton.textContent = "递送中…";
            statusText.textContent = "";

            try {
                const response = await fetch("https://api.web3forms.com/submit", {
                    method: "POST",
                    headers: { "Content-Type": "application/json", Accept: "application/json" },
                    body: JSON.stringify({
                        access_key: WEB3FORMS_ACCESS_KEY,
                        subject: "dxy 递来一张小纸条 💌",
                        from_name: "dxy 的小纸条",
                        message,
                        botcheck: form.botcheck.checked
                    })
                });
                const result = await response.json();
                if (!result.success) throw new Error(result.message);

                localStorage.removeItem(DRAFT_KEY);
                form.classList.add("sending");
                setTimeout(() => {
                    form.style.display = "none";
                    delivered.classList.add("show");
                }, 600);
            } catch (error) {
                statusText.textContent = "纸条好像没递出去，内容已经帮你保存好了，稍后再试一次吧";
            } finally {
                sendButton.disabled = false;
                sendButton.textContent = "折好，递出去";
            }
        });

        document.getElementById("writeAgain").addEventListener("click", () => {
            textarea.value = "";
            updateCounter();
            delivered.classList.remove("show");
            form.classList.remove("sending");
            form.style.display = "";
            textarea.focus();
        });
    </script>
</body>

</html>
